<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album Rater</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Light Mode Variables (Default) */
        :root {
            --bg: #ffffff;
            --surface: #f9f9f9;
            --text: #111111;
            --text-light: #666666;
            --border: #e0e0e0;
            --accent: #111111;
            --perfect-green: #00ff1a;
            --card-bg: #ffffff;
            --modal-overlay: rgba(255, 255, 255, 0.9);
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --text-light: #aaaaaa;
            --border: #333333;
            --accent: #ffffff;
            --card-bg: #181818;
            --modal-overlay: rgba(18, 18, 18, 0.9);
        }
        
        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Views */
        #main-view { display: block; }
        #rating-view { display: none; background: var(--bg); min-height: 100vh; }

        /* Header */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .site-header h1 { font-weight: 700; font-size: 26px; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;}
        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* Buttons & Controls */
        .btn {
            background-color: var(--accent); color: var(--bg);
            border: none; padding: 10px 20px; border-radius: 4px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Jost', sans-serif;
        }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background-color: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background-color: var(--surface); }

        select.control-select {
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px;
            background-color: var(--surface); color: var(--text); font-family: inherit;
            font-size: 13px; font-weight: 500; cursor: pointer; outline: none;
        }

        /* Stats Dashboard */
        .stats-container {
            display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .stat-box {
            flex: 1; min-width: 120px; background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 6px; text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; color: var(--text-light); }
        .stat-value.perfect-text { color: var(--perfect-green); }

        /* Controls Section */
        .controls-container {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
            padding-bottom: 15px; border-bottom: 1px dashed var(--border);
        }
        .filters { display: flex; gap: 10px; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            /* Removed align-items: start; so cards stretch to match heights */
        }

        /* --- PITCHFORK LAYOUT --- */
        .pf-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .pf-label {
            font-size: 10px; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-light); margin-bottom: 12px;
        }
        .pf-title {
            font-family: Georgia, serif; font-style: italic; font-weight: 700;
            font-size: 36px; margin: 0 0 10px 0; text-align: center; color: var(--text); line-height: 1.1;
        }
        .pf-artist {
            font-size: 20px; font-weight: 500; text-decoration: underline;
            margin: 0 0 8px 0; text-align: center; color: var(--text);
        }
        .pf-year {
            font-size: 14px; color: var(--text-light); margin: 0 0 20px 0; text-align: center;
        }
        
        .pf-showcase {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px; 
        }
        .pf-cover {
            width: 170px; height: 170px; object-fit: cover;
            border: 1px solid var(--border); background: var(--surface);
        }
        .pf-badge {
            width: 95px; height: 95px; border-radius: 50%;
            border: 5px solid var(--text); display: flex; align-items: center;
            justify-content: center; font-size: 34px; font-weight: 700; color: var(--text);
            background: var(--card-bg);
        }
        .pf-badge.perfect { border-color: var(--perfect-green); color: var(--perfect-green); }
        .pf-badge.unrated { border-color: var(--border); color: var(--text-light); font-size: 24px;}

        /* Album Card */
        .card {
            border: 1px solid var(--border);
            padding: 30px;
            background: var(--card-bg);
            display: flex; flex-direction: column;
            transition: background-color 0.3s, border-color 0.3s;
            height: 100%; box-sizing: border-box; /* Forces row alignment */
        }
        
        .card-content { flex-grow: 1; }

        .section-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-light); border-bottom: 1px solid var(--border);
            padding-bottom: 4px; margin: 20px 0 10px 0; font-weight: 600;
        }

        .card-review { font-size: 15px; line-height: 1.5; font-style: italic; margin-bottom: 20px; color: var(--text); }
        .card-favs { background: var(--surface); padding: 15px; border-left: 3px solid var(--text); font-size: 14px; margin-bottom: 20px;}
        .card-favs ul { margin: 0; padding-left: 20px; color: var(--text); }

        /* Card Actions & Three Dots Menu */
        .card-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);
        }
        .btn-rate { flex-grow: 1; margin-right: 10px; background-color: var(--text); color: var(--bg); }
        .btn-rate:hover { opacity: 0.8; }
        
        .menu-container { position: relative; }
        .settings-dropdown { position: relative; } /* Used for top settings gear */
        
        .dots-btn {
            background: none; border: none; font-size: 22px; cursor: pointer;
            padding: 5px 10px; color: var(--text); transition: 0.2s;
        }
        .dots-btn:hover { background: var(--surface); border-radius: 4px; }
        
        .dropdown {
            display: none; position: absolute; right: 0; bottom: 100%;
            background: var(--card-bg); border: 1px solid var(--border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 4px;
            z-index: 10; min-width: 140px; overflow: hidden; margin-bottom: 5px;
        }
        .settings-dropdown .dropdown { bottom: auto; top: 100%; margin-top: 5px; margin-bottom: 0; }
        
        .dropdown.active { display: block; }
        .dropdown button, .dropdown label.import-label {
            display: block; width: 100%; text-align: left; padding: 10px 15px;
            background: none; border: none; font-size: 13px; cursor: pointer;
            font-family: inherit; color: var(--text); box-sizing: border-box;
        }
        .dropdown button:hover, .dropdown label.import-label:hover { background: var(--surface); }
        .text-red { color: #d93025 !important; }

        /* --- BASIC INFO MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay); z-index: 100;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--border); padding: 30px;
            border-radius: 8px; width: 100%; max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .modal-box h2 { margin: 0 0 20px 0; font-size: 20px; color: var(--text); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-light); }
        .form-group input, .form-group textarea, .overall-review-area textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; 
            font-family: inherit; font-size: 14px; box-sizing: border-box;
            background-color: var(--bg); color: var(--text);
        }
        .form-group input:focus, .overall-review-area textarea:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }

        /* --- FULL SCREEN RATING EDITOR --- */
        .editor-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .editor-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .overall-review-area { margin-bottom: 40px; }
        .overall-review-area textarea { min-height: 120px; padding: 15px; resize: vertical; }

        /* Tracklist Editor */
        .track-list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text); padding-bottom: 10px; margin-bottom: 15px; }
        
        .track-wrapper { position: relative; margin-top: 15px; }
        .note-badge {
            position: absolute; top: -8px; left: 30px;
            background: var(--text); color: var(--bg);
            font-size: 9px; padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; font-weight: 700;
            pointer-events: none; z-index: 5; letter-spacing: 0.5px;
        }

        .track-row { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid var(--surface); }
        
        .track-num { width: 20px; text-align: right; font-weight: 600; color: var(--text-light); font-size: 15px; }
        
        .track-name-input {
            flex-grow: 1; padding: 5px 0; border: none; background: transparent;
            font-size: 16px; font-family: inherit; color: var(--text); outline: none;
        }
        .track-name-input::placeholder { color: var(--text-light); opacity: 0.5; }
        
        .track-rating-input {
            width: 45px; padding: 5px; border: 1px solid var(--border); border-radius: 4px;
            background: var(--surface); color: var(--text); text-align: center; font-size: 14px;
            font-family: inherit; font-weight: 600; outline: none;
        }
        .track-rating-input:focus { border-color: var(--accent); background: var(--bg);}
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Icons */
        .icon-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; transition: 0.2s; color: var(--text-light); }
        .icon-btn:hover { transform: scale(1.1); color: var(--text); }
        .star-icon { color: #ccc; font-size: 20px; line-height: 1; transition: 0.2s; }
        .star-icon.active { color: #f4b400; }
        
        .track-note-wrapper { width: 100%; display: none; padding-left: 35px; margin-top: 5px; box-sizing: border-box;}
        .track-note-wrapper.active { display: block; }
        .track-note-input { width: 100%; padding: 8px; border: none; border-left: 2px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; box-sizing: border-box; outline: none;}
        .track-note-input:focus { border-left-color: var(--text); }

    </style>
</head>
<body>

<div id="main-view">
    <div class="container">
        <div class="site-header">
            <h1>My Album Rater</h1>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="toggleTheme()">🌓 Theme</button>
                <div class="settings-dropdown">
                    <button class="btn btn-outline" onclick="toggleMenu('settings')">⚙️ Settings</button>
                    <div class="dropdown" id="menu-settings">
                        <button onclick="exportData()">⬇️ Export Backup</button>
                        <label class="import-label">
                            ⬆️ Import Backup
                            <input type="file" style="display:none" accept=".json" onchange="importData(event)">
                        </label>
                    </div>
                </div>
                <button class="btn" onclick="openBasicModal()">+ Add Album</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-container" id="stats-container">
            <!-- Populated via JS -->
        </div>

        <!-- Filtering & Sorting -->
        <div class="controls-container">
            <div style="font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">My Library</div>
            <div class="filters">
                <select class="control-select" id="filter-select" onchange="handleFilter(this.value)">
                    <option value="all">Show: All Albums</option>
                    <option value="rated">Rated Only</option>
                    <option value="unrated">Unrated Only</option>
                </select>
                <select class="control-select" id="sort-select" onchange="handleSort(this.value)">
                    <option value="default">Sort: Date Added (Default)</option>
                    <option value="score-high">Highest Rated</option>
                    <option value="score-low">Lowest Rated</option>
                    <option value="year-new">Release Year</option>
                    <option value="artist-az">Artist (A-Z)</option>
                </select>
            </div>
        </div>

        <div class="grid" id="albumGrid"></div>
    </div>
</div>

<div class="modal-overlay" id="basicModal">
    <div class="modal-box">
        <h2 id="modalTitle">Album Details</h2>
        
        <div class="form-group">
            <label>Album Title</label>
            <input type="text" id="b-title" placeholder="e.g. Purpose">
        </div>
        <div class="form-group">
            <label>Artist</label>
            <input type="text" id="b-artist" placeholder="e.g. Justin Bieber">
        </div>
        <div class="form-group">
            <label>Release Year</label>
            <input type="text" id="b-year" placeholder="e.g. 2015">
        </div>
        <div class="form-group">
            <label>Album Cover (Image URL)</label>
            <input type="text" id="b-cover" placeholder="Paste image link here...">
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeBasicModal()">Cancel</button>
            <button class="btn" onclick="saveBasicInfo()">Save Album</button>
        </div>
    </div>
</div>

<div id="rating-view">
    <div class="editor-container">
        <div class="editor-nav">
            <button class="btn btn-outline" onclick="closeRatingEditor()">← Back</button>
            <button class="btn" onclick="saveRatings()">Save Ratings</button>
        </div>

        <div class="pf-layout">
            <div class="pf-label">Albums</div>
            <div class="pf-title" id="r-title">Title</div>
            <div class="pf-artist" id="r-artist">Artist</div>
            <div class="pf-year" id="r-year">Year</div>
            <div class="pf-showcase">
                <img src="" id="r-cover" class="pf-cover">
                <div class="pf-badge" id="r-badge">-.-</div>
            </div>
        </div>

        <div class="overall-review-area">
            <div class="section-label" style="border:none; margin-bottom:5px;">Overall Review</div>
            <textarea id="r-review" placeholder="Write your thoughts on the entire project..."></textarea>
        </div>

        <div>
            <div class="track-list-header">
                <h3 style="margin:0; font-size:16px;">Tracklist</h3>
                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="addTrack()">+ Add Track</button>
            </div>
            
            <div id="editor-tracks-container">
                </div>
        </div>
    </div>
</div>

<script>
    // --- THEME LOGIC ---
    const savedTheme = localStorage.getItem('myAlbumTheme') || 'light';
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('myAlbumTheme', newTheme);
    }

    // --- DATABASE ---
    let albums = [];
    try {
        let savedData = localStorage.getItem('myAlbumRaterData');
        if (savedData) {
            albums = JSON.parse(savedData);
            if (!Array.isArray(albums)) albums = [];
        }
    } catch (e) {
        console.error("Safe load failed:", e);
        albums = [];
    }

    let editingId = null; 
    let currentRatingId = null;
    let tempTracks = [];
    
    // Sort & Filter States
    let currentSort = 'default';
    let currentFilter = 'all';

    // --- STATS LOGIC ---
    function renderStats() {
        const ratedAlbums = albums.filter(a => a.isRated && a.rating !== null);
        const totalRated = ratedAlbums.length;
        
        let sumRatings = 0;
        let perfects = 0;
        let artistCounts = {};

        ratedAlbums.forEach(a => {
            const r = parseFloat(a.rating);
            if (!isNaN(r)) {
                sumRatings += r;
                if (r === 5.0) {
                    perfects++;
                    artistCounts[a.artist] = (artistCounts[a.artist] || 0) + 1;
                }
            }
        });

        const globalAvg = totalRated > 0 ? (sumRatings / totalRated).toFixed(1) : '-.-';
        
        let topArtist = '-';
        let max5s = 0;
        for (let artist in artistCounts) {
            if (artistCounts[artist] > max5s) {
                max5s = artistCounts[artist];
                topArtist = artist;
            }
        }

        document.getElementById('stats-container').innerHTML = `
            <div class="stat-box">
                <div class="stat-value">${totalRated}</div>
                <div class="stat-label">Albums Rated</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">${globalAvg}</div>
                <div class="stat-label">Global Avg Score</div>
            </div>
            <div class="stat-box">
                <div class="stat-value perfect-text">${perfects}</div>
                <div class="stat-label">Perfect 5.0s</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" style="font-size:18px; margin-top:5px;">${topArtist}</div>
                <div class="stat-label">Top Artist (Most 5s)</div>
            </div>
        `;
    }

    // --- SORTING & FILTERING ---
    function handleSort(val) {
        currentSort = val;
        renderGrid();
    }

    function handleFilter(val) {
        currentFilter = val;
        renderGrid();
    }

    // --- IMPORT / EXPORT LOGIC ---
    function exportData() {
        const dataStr = JSON.stringify(albums, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "my_album_rater_backup.json";
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('menu-settings').classList.remove('active');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    albums = importedData;
                    saveToStorage();
                    renderGrid();
                    alert("Backup imported successfully!");
                } else {
                    alert("Invalid backup file format.");
                }
            } catch(err) {
                alert("Error reading file. Make sure it's a valid JSON backup.");
            }
        };
        reader.readAsText(file);
        document.getElementById('menu-settings').classList.remove('active');
    }

    // --- RENDER MAIN GRID ---
    function renderGrid() {
        const grid = document.getElementById('albumGrid');
        grid.innerHTML = '';
        
        // Update stats
        renderStats();

        // Apply Filters
        let displayAlbums = [...albums];
        if (currentFilter === 'rated') displayAlbums = displayAlbums.filter(a => a.isRated);
        if (currentFilter === 'unrated') displayAlbums = displayAlbums.filter(a => !a.isRated);

        // Apply Sorting
        if (currentSort === 'score-high') {
            displayAlbums.sort((a,b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
        } else if (currentSort === 'score-low') {
            displayAlbums.sort((a,b) => parseFloat(a.rating || 6) - parseFloat(b.rating || 6)); // unrated go to bottom
        } else if (currentSort === 'year-new') {
            displayAlbums.sort((a,b) => parseInt(b.year || 0) - parseInt(a.year || 0));
        } else if (currentSort === 'artist-az') {
            displayAlbums.sort((a,b) => (a.artist || '').localeCompare(b.artist || ''));
        }

        if (displayAlbums.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-light);">No albums match this view.</p>';
            return;
        }

        displayAlbums.forEach(album => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let ratingDisplay = '-.-';
            let badgeClass = 'unrated';
            let ratingStr = album.rating ? parseFloat(album.rating).toFixed(1) : null;

            if (ratingStr && !isNaN(ratingStr)) {
                ratingDisplay = ratingStr;
                badgeClass = ratingStr === '5.0' ? 'perfect' : '';
            }

            const coverImage = album.cover || 'https://via.placeholder.com/170?text=No+Cover';

            let extraContent = '';
            if (album.isRated) {
                if (album.review) {
                    extraContent += `<div class="section-label">Review</div><div class="card-review">"${album.review}"</div>`;
                }

                let favsHtml = '';
                let hasFavs = false;

                if (album.tracks && album.tracks.length > 0) {
                    album.tracks.forEach((t) => {
                        if (t && t.isFav) {
                            hasFavs = true;
                            favsHtml += `<li>${t.name || 'Unknown Track'}</li>`;
                        }
                    });

                    if (hasFavs) {
                        extraContent += `<div class="section-label">Favorite Tracks</div><div class="card-favs"><ul>${favsHtml}</ul></div>`;
                    }
                }
            }

            card.innerHTML = `
                <div class="card-content">
                    <div class="pf-layout">
                        <div class="pf-label">Albums</div>
                        <div class="pf-title">${album.title}</div>
                        <div class="pf-artist">${album.artist}</div>
                        <div class="pf-year">${album.year}</div>
                        <div class="pf-showcase">
                            <img src="${coverImage}" class="pf-cover" alt="Cover">
                            <div class="pf-badge ${badgeClass}">${ratingDisplay}</div>
                        </div>
                    </div>
                    ${extraContent}
                </div>

                <div class="card-actions">
                    <button class="btn btn-rate" onclick="openRatingEditor('${album.id}')">Rate Album</button>
                    
                    <div class="menu-container">
                        <button class="dots-btn" onclick="toggleMenu('${album.id}')">⋮</button>
                        <div class="dropdown" id="menu-${album.id}">
                            <button onclick="openBasicModal('${album.id}')">Edit Info</button>
                            <button class="text-red" onclick="deleteAlbum('${album.id}')">Delete Album</button>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function toggleMenu(id) {
        document.querySelectorAll('.dropdown').forEach(d => {
            if (d.id !== `menu-${id}`) d.classList.remove('active');
        });
        document.getElementById(`menu-${id}`).classList.toggle('active');
    }
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.menu-container') && !e.target.closest('.settings-dropdown')) {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    // --- BASIC INFO LOGIC (Modal) ---
    function openBasicModal(id = null) {
        editingId = id;
        const modal = document.getElementById('basicModal');
        const title = document.getElementById('modalTitle');
        
        if (id) {
            const album = albums.find(a => a.id === id);
            title.innerText = "Edit Album Info";
            document.getElementById('b-title').value = album.title;
            document.getElementById('b-artist').value = album.artist;
            document.getElementById('b-year').value = album.year;
            document.getElementById('b-cover').value = album.cover;
        } else {
            title.innerText = "Add New Album";
            document.getElementById('b-title').value = '';
            document.getElementById('b-artist').value = '';
            document.getElementById('b-year').value = '';
            document.getElementById('b-cover').value = '';
        }
        
        modal.classList.add('active');
    }

    function closeBasicModal() {
        document.getElementById('basicModal').classList.remove('active');
        editingId = null;
    }

    function saveBasicInfo() {
        const title = document.getElementById('b-title').value || 'Unknown Album';
        const artist = document.getElementById('b-artist').value || 'Unknown Artist';
        const year = document.getElementById('b-year').value || '';
        const cover = document.getElementById('b-cover').value || '';

        if (editingId) {
            let album = albums.find(a => a.id === editingId);
            album.title = title;
            album.artist = artist;
            album.year = year;
            album.cover = cover;
        } else {
            albums.push({
                id: Date.now().toString(),
                title: title, artist: artist, year: year, cover: cover,
                isRated: false, review: '', rating: null, tracks: []
            });
        }

        saveToStorage();
        closeBasicModal();
        renderGrid();
    }

    function deleteAlbum(id) {
        if (confirm("Delete this album? This cannot be undone.")) {
            albums = albums.filter(a => a.id !== id);
            saveToStorage();
            renderGrid();
        }
    }

    // --- RATING EDITOR LOGIC ---
    function openRatingEditor(id) {
        currentRatingId = id;
        const album = albums.find(a => a.id === id);
        
        document.getElementById('r-title').innerText = album.title;
        document.getElementById('r-artist').innerText = album.artist;
        document.getElementById('r-year').innerText = album.year;
        document.getElementById('r-cover').src = album.cover || 'https://via.placeholder.com/170?text=No+Cover';
        document.getElementById('r-review').value = album.review || '';
        
        tempTracks = album.tracks ? JSON.parse(JSON.stringify(album.tracks)) : [];
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('rating-view').style.display = 'block';
        window.scrollTo(0,0);
        
        renderEditorTracks();
    }

    function closeRatingEditor() {
        document.getElementById('rating-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        currentRatingId = null;
        renderGrid();
    }

    // --- TRACKLIST LOGIC ---
    function renderEditorTracks() {
        const container = document.getElementById('editor-tracks-container');
        container.innerHTML = '';

        tempTracks.forEach((track, index) => {
            const rowWrapper = document.createElement('div');
            rowWrapper.className = 'track-wrapper';
            
            const starClass = track.isFav ? 'active' : '';
            const noteIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`;
            const noteAreaStyle = track.showNote ? 'active' : '';
            
            const badgeHtml = (track.note && track.note.trim() !== '') ? `<div class="note-badge">Note Added</div>` : '';

            rowWrapper.innerHTML = `
                ${badgeHtml}
                <div class="track-row">
                    <div class="track-num">${index + 1}</div>
                    
                    <input type="text" class="track-name-input" placeholder="Track Name" value="${track.name || ''}" oninput="updateTrack(${index}, 'name', this.value)">
                    
                    <input type="number" class="track-rating-input" placeholder="0.0" step="0.1" min="0" max="5" value="${track.rating || ''}" oninput="updateTrack(${index}, 'rating', this.value)">
                    
                    <button class="icon-btn" onclick="toggleFav(${index})" title="Favorite Track">
                        <span class="star-icon ${starClass}">★</span>
                    </button>
                    
                    <button class="icon-btn" onclick="toggleNote(${index})" title="Add Note">
                        ${noteIcon}
                    </button>
                    
                    <button class="icon-btn" onclick="removeTrack(${index})" style="color: #d93025; font-size:18px;" title="Remove">×</button>
                </div>
                
                <div class="track-note-wrapper ${noteAreaStyle}">
                    <input type="text" class="track-note-input" placeholder="Type a note for this track..." value="${track.note || ''}" oninput="updateTrack(${index}, 'note', this.value)">
                </div>
            `;
            container.appendChild(rowWrapper);
        });

        updateLiveRating();
    }

    function addTrack() {
        tempTracks.push({ name: '', rating: '', isFav: false, note: '', showNote: false });
        renderEditorTracks();
    }

    function updateTrack(index, field, value) {
        if (field === 'rating' && value !== '') {
            let num = parseFloat(value);
            if (num > 5) {
                value = '5';
                document.querySelectorAll('.track-rating-input')[index].value = '5';
            } else if (num < 0) {
                value = '0';
                document.querySelectorAll('.track-rating-input')[index].value = '0';
            }
        }

        tempTracks[index][field] = value;
        
        if (field === 'note') {
            const wrappers = document.querySelectorAll('.track-wrapper');
            if (wrappers[index]) {
                let badge = wrappers[index].querySelector('.note-badge');
                if (value.trim() !== '' && !badge) {
                    badge = document.createElement('div');
                    badge.className = 'note-badge';
                    badge.innerText = 'Note Added';
                    wrappers[index].insertBefore(badge, wrappers[index].firstChild);
                } else if (value.trim() === '' && badge) {
                    badge.remove();
                }
            }
        }
        
        if (field === 'rating') updateLiveRating();
    }

    function toggleFav(index) {
        tempTracks[index].isFav = !tempTracks[index].isFav;
        renderEditorTracks();
    }

    function toggleNote(index) {
        tempTracks[index].showNote = !tempTracks[index].showNote;
        renderEditorTracks();
    }

    function removeTrack(index) {
        tempTracks.splice(index, 1);
        renderEditorTracks();
    }

    function updateLiveRating() {
        const badge = document.getElementById('r-badge');
        
        let total = 0;
        let count = 0;
        
        tempTracks.forEach(t => {
            let val = parseFloat(t.rating);
            if (!isNaN(val)) {
                total += val;
                count++;
            }
        });

        if (count === 0) {
            badge.innerText = '-.-';
            badge.className = 'pf-badge unrated';
            return null;
        }

        let avg = (total / count).toFixed(1);
        badge.innerText = avg;
        badge.className = avg === '5.0' ? 'pf-badge perfect' : 'pf-badge';
        return avg;
    }

    function saveRatings() {
        const album = albums.find(a => a.id === currentRatingId);
        
        album.review = document.getElementById('r-review').value;
        album.tracks = tempTracks;
        album.rating = updateLiveRating();
        album.isRated = true;

        saveToStorage();
        closeRatingEditor();
    }

    // --- UTILS ---
    function saveToStorage() {
        localStorage.setItem('myAlbumRaterData', JSON.stringify(albums));
    }

    // Init
    renderGrid();
</script>
</body>
</html>
