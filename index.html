<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album Rater</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Light Mode Variables (Default) */
        :root {
            --bg: #ffffff;
            --surface: #f9f9f9;
            --text: #111111;
            --text-light: #666666;
            --border: #e0e0e0;
            --accent: #111111;
            --perfect-green: #00ff1a;
            --card-bg: #ffffff;
            --modal-overlay: rgba(255, 255, 255, 0.9);
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --text-light: #aaaaaa;
            --border: #333333;
            --accent: #ffffff;
            --card-bg: #181818;
            --modal-overlay: rgba(18, 18, 18, 0.9);
        }
        
        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Views */
        #main-view { display: block; }
        #rating-view { display: none; background: var(--bg); min-height: 100vh; }

        /* Header Layout */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .site-header h1 { font-weight: 700; font-size: 26px; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Buttons & Controls */
        .btn {
            background-color: var(--accent);
            color: var(--bg);
            border: none; padding: 8px 16px; border-radius: 4px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Jost', sans-serif;
        }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background-color: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background-color: var(--surface); }

        select.control-select {
            padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 4px;
            background-color: var(--surface); color: var(--text); font-family: inherit;
            font-size: 12px; font-weight: 500; cursor: pointer; outline: none;
        }

        /* Controls Section */
        .controls-container {
            display: flex; justify-content: flex-end; align-items: center; margin-bottom: 30px;
            padding-bottom: 15px; border-bottom: 1px dashed var(--border);
        }
        .filters { display: flex; gap: 10px; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
        }

        /* --- RE-LISTEN TOGGLES --- */
        .card-top-bar {
            display: flex; justify-content: flex-end; margin-bottom: 10px;
        }
        .relisten-switch {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            display: flex; overflow: hidden; font-size: 10px; font-weight: 600; text-transform: uppercase;
        }
        .relisten-btn {
            padding: 4px 10px; cursor: pointer; background: transparent; border: none;
            color: var(--text-light); transition: 0.2s; font-family: inherit; font-size: inherit; font-weight: inherit;
        }
        .relisten-btn.active { background: var(--text); color: var(--bg); }
        
        .editor-mode-selector { display: flex; justify-content: center; margin-bottom: 25px; }
        .editor-mode-selector .relisten-switch { font-size: 11px; }
        .editor-mode-selector .relisten-btn { padding: 6px 15px; }

        /* --- PITCHFORK LAYOUT --- */
        .pf-layout { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .pf-label {
            font-size: 10px; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-light); margin-bottom: 12px;
        }
        .pf-title {
            font-family: Georgia, serif; font-style: italic; font-weight: 700;
            font-size: 36px; margin: 0 0 10px 0; text-align: center; color: var(--text); line-height: 1.1;
        }
        .pf-artist {
            font-size: 20px; font-weight: 500; text-decoration: underline;
            margin: 0 0 8px 0; text-align: center; color: var(--text);
        }
        .pf-year { font-size: 14px; color: var(--text-light); margin: 0 0 20px 0; text-align: center; }
        
        .pf-showcase { display: flex; align-items: center; justify-content: center; gap: 25px; }
        .pf-cover {
            width: 170px; height: 170px; object-fit: cover;
            border: 1px solid var(--border); background: var(--surface);
        }
        .pf-badge {
            width: 95px; height: 95px; border-radius: 50%;
            border: 5px solid var(--text); display: flex; align-items: center;
            justify-content: center; font-size: 34px; font-weight: 700; color: var(--text); background: var(--card-bg);
        }
        .pf-badge.perfect { border-color: var(--perfect-green); color: var(--perfect-green); }
        .pf-badge.unrated { border-color: var(--border); color: var(--text-light); font-size: 24px;}

        /* Album Card */
        .card {
            border: 1px solid var(--border); padding: 30px;
            background: var(--card-bg); display: flex; flex-direction: column;
            transition: background-color 0.3s, border-color 0.3s;
            height: 100%; box-sizing: border-box; position: relative;
        }
        .card-content { flex-grow: 1; }

        .section-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-light); border-bottom: 1px solid var(--border);
            padding-bottom: 4px; margin: 20px 0 10px 0; font-weight: 600;
        }

        .card-review { font-size: 15px; line-height: 1.5; font-style: italic; margin-bottom: 20px; color: var(--text); }
        
        /* Flexbox for Big Three & Favs */
        .card-highlights-container {
            display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start;
        }
        .highlight-col { flex: 1; }
        .card-favs { 
            background: var(--surface); padding: 15px; 
            border-left: 3px solid var(--text); font-size: 14px; box-sizing: border-box; height: auto;
        }
        .card-favs ul { margin: 0; padding-left: 20px; color: var(--text); }
        
        /* BIG THREE SYMMETRY FIX */
        .big-three-list {
            list-style-type: none !important; padding-left: 0 !important; margin: 0;
        }
        .big-three-list li {
            margin-bottom: 8px; display: flex; justify-content: flex-start; align-items: center; gap: 10px;
        }
        .crown-icon { font-size: 14px; opacity: 0.8; color: var(--text); flex-shrink: 0; }

        /* Card Actions & Three Dots Menu */
        .card-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);
        }
        .btn-rate { flex-grow: 1; margin-right: 10px; background-color: var(--text); color: var(--bg); }
        .btn-rate:hover { opacity: 0.8; }
        
        .menu-container { position: relative; }
        .settings-dropdown { position: relative; }
        
        .dots-btn {
            background: none; border: none; font-size: 22px; cursor: pointer;
            padding: 5px 10px; color: var(--text); transition: 0.2s;
        }
        .dots-btn:hover { background: var(--surface); border-radius: 4px; }
        
        .dropdown {
            display: none; position: absolute; right: 0; bottom: 100%;
            background: var(--card-bg); border: 1px solid var(--border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 4px;
            z-index: 10; min-width: 140px; overflow: hidden; margin-bottom: 5px;
        }
        .settings-dropdown .dropdown { bottom: auto; top: 100%; margin-top: 5px; margin-bottom: 0; left: 0; right: auto; }
        .dropdown.active { display: block; }
        .dropdown button, .dropdown label.import-label {
            display: block; width: 100%; text-align: left; padding: 10px 15px;
            background: none; border: none; font-size: 13px; cursor: pointer;
            font-family: inherit; color: var(--text); box-sizing: border-box;
        }
        .dropdown button:hover, .dropdown label.import-label:hover { background: var(--surface); }
        .text-red { color: #d93025 !important; }

        /* --- MODALS (Info & Stats) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay); z-index: 100;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--border); padding: 30px;
            border-radius: 8px; width: 100%; max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto;
        }
        .modal-box h2 { margin: 0 0 20px 0; font-size: 20px; color: var(--text); }
        
        /* Stats Specific UI */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 20px 15px; border-radius: 6px; text-align: center;
        }
        .stat-card-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-light); margin-bottom: 8px; font-weight: 600;
        }
        .stat-card-value {
            font-size: 26px; font-family: Georgia, serif; font-weight: 700;
            color: var(--text); line-height: 1.1;
        }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-light); }
        .form-group input, .form-group textarea, .overall-review-area textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; 
            font-family: inherit; font-size: 14px; box-sizing: border-box; background-color: var(--bg); color: var(--text);
        }
        .form-group input:focus, .overall-review-area textarea:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        /* API Search Results Area */
        #api-results { max-height: 150px; overflow-y: auto; margin-bottom: 15px; }
        .api-result-item {
            display: flex; align-items: center; gap: 10px; padding: 8px; 
            border: 1px solid var(--border); border-radius: 4px; cursor: pointer; margin-bottom: 5px;
            transition: 0.2s; background: var(--surface);
        }
        .api-result-item:hover { border-color: var(--accent); }

        /* --- FULL SCREEN RATING EDITOR --- */
        .editor-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .editor-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        .overall-review-area { margin-bottom: 40px; }
        .overall-review-area textarea { min-height: 120px; padding: 15px; resize: vertical; }

        /* Tracklist Editor */
        .track-list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text); padding-bottom: 10px; margin-bottom: 15px; }
        
        .track-wrapper { position: relative; margin-top: 15px; }
        .note-badge {
            position: absolute; top: -8px; left: 30px; background: var(--text); color: var(--bg);
            font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 700;
            pointer-events: none; z-index: 5; letter-spacing: 0.5px;
        }

        .track-row { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid var(--surface); }
        .track-num { width: 20px; text-align: right; font-weight: 600; color: var(--text-light); font-size: 15px; }
        
        .track-name-input {
            flex-grow: 1; padding: 5px 0; border: none; background: transparent;
            font-size: 16px; font-family: inherit; color: var(--text); outline: none;
        }
        .track-name-input::placeholder { color: var(--text-light); opacity: 0.5; }
        
        .track-rating-input {
            width: 45px; padding: 5px; border: 1px solid var(--border); border-radius: 4px;
            background: var(--surface); color: var(--text); text-align: center; font-size: 14px; font-family: inherit; font-weight: 600; outline: none;
        }
        .track-rating-input:focus { border-color: var(--accent); background: var(--bg);}
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Icons */
        .icon-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; transition: 0.2s; color: var(--text-light); }
        .icon-btn:hover { transform: scale(1.1); color: var(--text); }
        .star-icon { color: #ccc; font-size: 20px; line-height: 1; transition: 0.2s; }
        .star-icon.active { color: #f4b400; }
        
        .track-note-wrapper { width: 100%; display: none; padding-left: 35px; margin-top: 5px; box-sizing: border-box;}
        .track-note-wrapper.active { display: block; }
        .track-note-input { width: 100%; padding: 8px; border: none; border-left: 2px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; box-sizing: border-box; outline: none;}
        .track-note-input:focus { border-left-color: var(--text); }

        /* --- LAST.FM TRACKLIST SEARCH (ADDITIVE) --- */
        .track-list-header > h3 { margin-right: auto !important; }
        .tracklist-search { display: flex; align-items: center; gap: 8px; }
        .tracklist-search-input {
            width: 220px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 4px;
            background: var(--bg); color: var(--text); font: inherit; font-size: 12px; box-sizing: border-box;
        }
        .tracklist-search-input:focus { outline: none; border-color: var(--accent); }
        .tracklist-search-status { min-height: 18px; margin: -7px 0 8px; color: var(--text-light); font-size: 12px; }
        .tracklist-search-status.is-error { color: #d93025; }
        .tracklist-search-status.is-success { color: #188038; }
        .track-move-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        @media (max-width: 600px) {
            .track-list-header { flex-wrap: wrap; gap: 8px; align-items: flex-start; }
            .track-list-header > h3 { width: 100%; }
            .tracklist-search { flex: 1; min-width: 0; }
            .tracklist-search-input { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>

<div id="main-view">
    <div class="container">
        <div class="site-header">
            <div class="header-left">
                <h1>My Album Rater</h1>
                <div class="settings-dropdown">
                    <button class="btn btn-outline" onclick="toggleMenu('settings')">⚙️ Settings</button>
                    <div class="dropdown" id="menu-settings">
                        <button onclick="exportData()">⬇️ Export Backup</button>
                        <label class="import-label">
                            ⬆️ Import Backup
                            <input type="file" style="display:none" accept=".json" onchange="importData(event)">
                        </label>
                    </div>
                </div>
                <button class="btn btn-outline" onclick="toggleTheme()">🌓 Theme</button>
            </div>
            
            <div class="header-right">
                <button class="btn btn-outline" onclick="openStatsModal()">📊 Stats</button>
                <button class="btn" onclick="openBasicModal()">+ Add Album</button>
            </div>
        </div>

        <div class="controls-container">
            <div class="filters">
                <select class="control-select" id="filter-select" onchange="handleFilter(this.value)">
                    <option value="all">Show: All Albums</option>
                    <option value="rated">Rated Only</option>
                    <option value="unrated">Unrated Only</option>
                </select>
                <select class="control-select" id="sort-select" onchange="handleSort(this.value)">
                    <option value="default">Sort: Date Added (Default)</option>
                    <option value="score-high">Highest Rated</option>
                    <option value="score-low">Lowest Rated</option>
                    <option value="year-new">Release Year</option>
                    <option value="artist-az">Artist (A-Z)</option>
                </select>
            </div>
        </div>

        <div class="grid" id="albumGrid"></div>
    </div>
</div>

<div class="modal-overlay" id="statsModal">
    <div class="modal-box" style="max-width: 500px;">
        <h2 style="text-align: center; font-family: Georgia, serif; font-style: italic; margin-bottom: 25px;">Library Analytics</h2>
        <div class="stats-grid" id="stats-grid-content"></div>
        <div class="modal-actions" style="justify-content: center; margin-top: 20px;">
            <button class="btn btn-outline" style="width: 100%;" onclick="closeStatsModal()">Close</button>
        </div>
    </div>
</div>

<!-- Add Album Modal -->
<div class="modal-overlay" id="basicModal">
    <div class="modal-box">
        <h2 id="modalTitle">Add New Album</h2>
        
        <div class="form-group">
            <label>Album Title</label>
            <input type="text" id="b-title" placeholder="e.g. Purpose">
        </div>
        
        <div class="form-group">
            <label>Artist</label>
            <input type="text" id="b-artist" placeholder="e.g. Justin Bieber">
        </div>
        
        <div class="form-group">
            <label>Release Year (Optional)</label>
            <input type="text" id="b-year" placeholder="e.g. 2015">
        </div>
        
        <div class="form-group">
            <label>Album Cover (Image URL)</label>
            <input type="text" id="b-cover" placeholder="Paste image link here...">
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeBasicModal()">Cancel</button>
            <button class="btn" onclick="saveBasicInfo()">Save Album</button>
        </div>
    </div>
</div>

<div id="rating-view">
    <div class="editor-container">
        
        <div class="editor-nav">
            <button class="btn btn-outline" onclick="closeRatingEditor()">← Back</button>
            <button class="btn" onclick="saveRatings()">Save Ratings</button>
        </div>

        <div class="editor-mode-selector">
            <div class="relisten-switch">
                <button class="relisten-btn active" id="editor-mode-original" onclick="switchEditorMode('original')">Original Rating</button>
                <button class="relisten-btn" id="editor-mode-relisten" onclick="switchEditorMode('relisten')">Re-Listen Rating</button>
            </div>
        </div>

        <div class="pf-layout">
            <div class="pf-label">Albums</div>
            <div class="pf-title" id="r-title">Title</div>
            <div class="pf-artist" id="r-artist">Artist</div>
            <div class="pf-year" id="r-year">Year</div>
            <div class="pf-showcase">
                <img src="" id="r-cover" class="pf-cover">
                <div class="pf-badge" id="r-badge">-.-</div>
            </div>
        </div>

        <div class="overall-review-area">
            <div class="section-label" style="border:none; margin-bottom:5px;">Overall Review</div>
            <textarea id="r-review" placeholder="Write your thoughts on the entire project..."></textarea>
        </div>

        <div>
            <div class="track-list-header">
                <h3 style="margin:0; font-size:16px;">Tracklist</h3>
                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="addTrack()">+ Add Track</button>
                <div class="tracklist-search">
                    <input id="lastfm-tracklist-query" class="tracklist-search-input" type="text" placeholder="Album or Artist + Album" aria-label="Album search for tracklist" onkeydown="if (event.key === 'Enter') autoFillTracklist()">
                    <button id="lastfm-tracklist-button" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px; white-space: nowrap;" onclick="autoFillTracklist()">Auto-Fill Tracklist</button>
                </div>
            </div>
            <div id="lastfm-tracklist-status" class="tracklist-search-status" role="status" aria-live="polite"></div>
            
            <div id="editor-tracks-container"></div>
        </div>
    </div>
</div>

<script>
    // --- THEME INIT ---
    const savedTheme = localStorage.getItem('myAlbumTheme') || 'light';
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    // --- DATABASE INIT ---
    let albums = [];
    try {
        let savedData = localStorage.getItem('myAlbumRaterData');
        if (savedData) {
            albums = JSON.parse(savedData);
            if (!Array.isArray(albums)) albums = [];
        }
    } catch (e) {
        console.error("Safe load failed:", e);
        albums = [];
    }

    let currentRatingId = null;
    let editingId = null; // Added to track which album is being edited
    let tempTracks = [];
    let tempReListenTracks = [];
    let tempReview = "";
    let tempReListenReview = "";
    let currentEditorMode = 'original'; // 'original' or 'relisten'

    // --- LAST.FM TRACKLIST SEARCH (ADDITIVE) ---
    // Paste your free Last.fm API key between these quotes.
    const LASTFM_API_KEY = '08d80a6f38b6aef4a5b60b05ef0e2c57';
    const LASTFM_API_URL = 'https://ws.audioscrobbler.com/2.0/';

    function saveToStorage() {
        localStorage.setItem('myAlbumRaterData', JSON.stringify(albums));
    }

    function setLastFmTracklistStatus(message, type = '') {
        const status = document.getElementById('lastfm-tracklist-status');
        status.textContent = message;
        status.className = 'tracklist-search-status' + (type ? ` is-${type}` : '');
    }

    function asLastFmArray(value) {
        if (!value) return [];
        return Array.isArray(value) ? value : [value];
    }

    function getArtistAndAlbumFromQuery(query) {
        // Supports: "Album title", "Artist + Album", "Artist - Album", and "Artist by Album".
        const artistAlbumMatch = query.match(/^(.+?)\s*(?:\+|[-–—]|\bby\b)\s*(.+)$/i);
        if (!artistAlbumMatch) return null;

        return {
            artist: artistAlbumMatch[1].trim(),
            album: artistAlbumMatch[2].trim()
        };
    }

    async function requestLastFm(method, parameters) {
        const searchParameters = new URLSearchParams({
            method: method,
            api_key: LASTFM_API_KEY,
            format: 'json',
            ...parameters
        });

        const response = await fetch(`${LASTFM_API_URL}?${searchParameters.toString()}`);
        const data = await response.json();

        if (!response.ok || data.error) {
            throw new Error(data.message || `Last.fm request failed (${response.status}).`);
        }

        return data;
    }

    async function resolveLastFmAlbum(query) {
        const artistAndAlbum = getArtistAndAlbumFromQuery(query);
        if (artistAndAlbum) return artistAndAlbum;

        const searchData = await requestLastFm('album.search', { album: query, limit: '1' });
        const matches = searchData.results && searchData.results.albummatches && searchData.results.albummatches.album;
        const firstMatch = asLastFmArray(matches)[0];

        if (!firstMatch || !firstMatch.artist || !firstMatch.name) {
            throw new Error('Album not found.');
        }

        return { artist: firstMatch.artist, album: firstMatch.name };
    }

    function createLastFmTrack(trackName) {
        return { name: trackName, rating: '', isFav: false, note: '', showNote: false };
    }

    async function autoFillTracklist() {
        const input = document.getElementById('lastfm-tracklist-query');
        const button = document.getElementById('lastfm-tracklist-button');
        const query = input.value.trim();

        if (!query) {
            setLastFmTracklistStatus('Enter an album title or Artist + Album first.', 'error');
            input.focus();
            return;
        }

        if (LASTFM_API_KEY === 'PASTE_YOUR_LASTFM_API_KEY_HERE') {
            setLastFmTracklistStatus('Add your Last.fm API key to LASTFM_API_KEY before searching.', 'error');
            return;
        }

        const originalButtonText = button.textContent;
        button.disabled = true;
        button.textContent = 'Searching...';
        setLastFmTracklistStatus('Searching Last.fm...');

        try {
            const matchedAlbum = await resolveLastFmAlbum(query);
            const albumInfo = await requestLastFm('album.getInfo', {
                artist: matchedAlbum.artist,
                album: matchedAlbum.album,
                autocorrect: '1'
            });
            const rawTracks = albumInfo.album && albumInfo.album.tracks && albumInfo.album.tracks.track;
            const trackNames = asLastFmArray(rawTracks)
                .map(track => (typeof track === 'string' ? track : track && track.name))
                .map(name => (name || '').trim())
                .filter(Boolean);

            if (trackNames.length === 0) {
                setLastFmTracklistStatus(`Last.fm found “${matchedAlbum.album}”, but it has no tracklist to add.`, 'error');
                return;
            }

            // Append only after both API calls succeeded; existing typed tracks are never replaced or removed.
            const activeTracks = getActiveTracks();
            trackNames.forEach(trackName => activeTracks.push(createLastFmTrack(trackName)));

            renderEditorTracks();
            updateLiveRating();
            setLastFmTracklistStatus(`Added ${trackNames.length} track${trackNames.length === 1 ? '' : 's'} from Last.fm. Existing tracks were kept.`, 'success');
        } catch (error) {
            console.error('Last.fm tracklist search failed:', error);
            setLastFmTracklistStatus('Couldn’t load a tracklist. Check the album name, your API key, and your connection, then try again.', 'error');
        } finally {
            button.disabled = false;
            button.textContent = originalButtonText;
        }
    }

    // --- THEME & MENUS ---
    function toggleTheme() {
        const root = document.documentElement;
        const currentTheme = root.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', newTheme);
        localStorage.setItem('myAlbumTheme', newTheme);
    }

    function toggleMenu(menuId) {
        const menu = document.getElementById(`menu-${menuId}`);
        menu.classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.settings-dropdown') && !e.target.closest('.menu-container')) {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    // --- DATA BACKUPS ---
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(albums));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "my_album_rater_backup.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        document.getElementById('menu-settings').classList.remove('active');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    albums = imported;
                    saveToStorage();
                    renderAlbums();
                    alert('Backup imported successfully!');
                }
            } catch (err) {
                alert('Invalid backup file.');
            }
        };
        reader.readAsText(file);
        document.getElementById('menu-settings').classList.remove('active');
    }

    // --- MODALS (Add/Edit Album) ---
    function openBasicModal(id = null) {
        editingId = id;
        const title = document.getElementById('modalTitle');
        
        if (id) {
            const album = albums.find(a => a.id === id);
            title.innerText = 'Edit Album Info';
            document.getElementById('b-title').value = album.title || '';
            document.getElementById('b-artist').value = album.artist || '';
            document.getElementById('b-year').value = album.year || '';
            document.getElementById('b-cover').value = album.cover || '';
        } else {
            title.innerText = 'Add New Album';
            document.getElementById('b-title').value = '';
            document.getElementById('b-artist').value = '';
            document.getElementById('b-year').value = '';
            document.getElementById('b-cover').value = '';
        }
        document.getElementById('basicModal').classList.add('active');
    }

    function closeBasicModal() {
        document.getElementById('basicModal').classList.remove('active');
        editingId = null;
    }

    function saveBasicInfo() {
        const title = document.getElementById('b-title').value.trim() || 'Unknown Album';
        const artist = document.getElementById('b-artist').value.trim() || 'Unknown Artist';
        const year = document.getElementById('b-year').value.trim() || '';
        const cover = document.getElementById('b-cover').value.trim() || 'https://via.placeholder.com/170?text=No+Cover';

        if (editingId) {
            // Update existing album
            const album = albums.find(a => a.id === editingId);
            album.title = title;
            album.artist = artist;
            album.year = year;
            album.cover = cover;
        } else {
            // Create new album
            const newAlbum = {
                id: Date.now().toString(),
                title: title,
                artist: artist,
                year: year,
                cover: cover,
                isRated: false,
                tracks: []
            };
            albums.push(newAlbum);
        }

        saveToStorage();
        closeBasicModal();
        renderAlbums();
    }

    // --- RATING EDITOR ---
    function openRatingEditor(id) {
        currentRatingId = id;
        const album = albums.find(a => a.id === id);
        
        tempTracks = album.tracks ? JSON.parse(JSON.stringify(album.tracks)) : [];
        tempReview = album.review || "";
        
        if (album.reListenTracks && album.reListenTracks.length > 0) {
            tempReListenTracks = JSON.parse(JSON.stringify(album.reListenTracks));
        } else {
            tempReListenTracks = tempTracks.map(t => ({
                name: t.name,
                rating: '',
                isFav: false,
                note: '',
                showNote: false
            }));
        }
        tempReListenReview = album.reListenReview || "";
        
        document.getElementById('r-title').innerText = album.title;
        document.getElementById('r-artist').innerText = album.artist;
        document.getElementById('r-year').innerText = album.year;
        document.getElementById('r-cover').src = album.cover || 'https://via.placeholder.com/170?text=No+Cover';
        
        currentEditorMode = 'original';
        document.getElementById('editor-mode-original').classList.add('active');
        document.getElementById('editor-mode-relisten').classList.remove('active');
        document.getElementById('r-review').value = tempReview;
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('rating-view').style.display = 'block';
        window.scrollTo(0,0);
        
        renderEditorTracks();
        updateLiveRating();
    }

    function closeRatingEditor() {
        document.getElementById('rating-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        currentRatingId = null;
    }

    function switchEditorMode(mode) {
        if (currentEditorMode === 'original') {
            tempReview = document.getElementById('r-review').value;
        } else {
            tempReListenReview = document.getElementById('r-review').value;
        }

        currentEditorMode = mode;
        document.getElementById('editor-mode-original').classList.toggle('active', mode === 'original');
        document.getElementById('editor-mode-relisten').classList.toggle('active', mode === 'relisten');

        document.getElementById('r-review').value = mode === 'original' ? tempReview : tempReListenReview;
        renderEditorTracks();
        updateLiveRating();
    }

    function getActiveTracks() {
        return currentEditorMode === 'original' ? tempTracks : tempReListenTracks;
    }

    function renderEditorTracks() {
        const container = document.getElementById('editor-tracks-container');
        container.innerHTML = '';
        let tracks = getActiveTracks();
        
        tracks.forEach((t, index) => {
            const row = document.createElement('div');
            row.className = 'track-wrapper';
            
            const starClass = t.isFav ? 'active' : '';
            const noteIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`;
            const badgeHtml = (t.note && t.note.trim() !== '') ? `<div class="note-badge">Note Added</div>` : '';

            row.innerHTML = `
                ${badgeHtml}
                <div class="track-row">
                    <div class="track-num">${index + 1}.</div>
                    <input type="text" class="track-name-input" value="${t.name || ''}" onchange="updateTrackName(${index}, this.value)" placeholder="Track title...">
                    
                    <input type="number" class="track-rating-input" value="${t.rating || ''}" step="0.1" min="0" max="5" oninput="updateTrackRating(${index}, this)">
                    
                    <button class="icon-btn" onclick="toggleFav(${index})" title="Favorite Track">
                        <span class="star-icon ${starClass}">★</span>
                    </button>
                    
                    <button class="icon-btn" onclick="toggleNote(${index})" title="Add Note">
                        ${noteIcon}
                    </button>

                    <button class="icon-btn track-move-btn" onclick="moveTrack(${index}, -1)" title="Move track up" ${index === 0 ? 'disabled' : ''}>↑</button>
                    <button class="icon-btn track-move-btn" onclick="moveTrack(${index}, 1)" title="Move track down" ${index === tracks.length - 1 ? 'disabled' : ''}>↓</button>
                    
                    <button class="icon-btn" style="color: #d93025; font-size:18px;" onclick="removeTrack(${index})" title="Remove">×</button>
                </div>
                <div class="track-note-wrapper ${t.showNote ? 'active' : ''}">
                    <input type="text" class="track-note-input" value="${t.note || ''}" placeholder="Thoughts on this track..." onchange="updateTrackNote(${index}, this.value)">
                </div>
            `;
            container.appendChild(row);
        });
    }

    function addTrack() {
        let tracks = getActiveTracks();
        tracks.push({ name: '', rating: '', isFav: false, note: '', showNote: false });
        renderEditorTracks();
    }

    function moveTrack(index, direction) {
        let tracks = getActiveTracks();
        const destinationIndex = index + direction;

        if (destinationIndex < 0 || destinationIndex >= tracks.length) return;

        [tracks[index], tracks[destinationIndex]] = [tracks[destinationIndex], tracks[index]];
        renderEditorTracks();
    }
    
    function removeTrack(index) {
        let tracks = getActiveTracks();
        tracks.splice(index, 1);
        renderEditorTracks();
        updateLiveRating();
    }

    function updateTrackName(index, val) { getActiveTracks()[index].name = val; }
    function updateTrackNote(index, val) { getActiveTracks()[index].note = val; renderEditorTracks(); }
    
    function toggleNote(index) { 
        let tracks = getActiveTracks();
        tracks[index].showNote = !tracks[index].showNote; 
        renderEditorTracks(); 
    }
    
    function toggleFav(index) {
        let tracks = getActiveTracks();
        tracks[index].isFav = !tracks[index].isFav;
        renderEditorTracks();
    }

    function updateTrackRating(index, element) {
    let val = element.value;
    
    if (val !== '') {
        let num = parseFloat(val);
        
        // If the number is greater than 5, force it to 5
        if (num > 5) {
            val = '5';
            element.value = val; // This instantly updates the text box visually
        } 
        // If the number is less than 0, force it to 0
        else if (num < 0) {
            val = '0';
            element.value = val;
        }
    }
    
    getActiveTracks()[index].rating = val;
    updateLiveRating();
}

    function calculateAverage(tracks) {
        let total = 0; let count = 0;
        tracks.forEach(t => {
            let val = parseFloat(t.rating);
            if (!isNaN(val) && t.rating !== "") { total += val; count++; }
        });
        if (count === 0) return null;
        return (total / count).toFixed(1);
    }

    function updateLiveRating() {
        const badge = document.getElementById('r-badge');
        let avg = calculateAverage(getActiveTracks());
        
        if (!avg) {
            badge.innerText = '-.-';
            badge.className = 'pf-badge unrated';
        } else {
            badge.innerText = avg;
            badge.className = avg === '5.0' ? 'pf-badge perfect' : 'pf-badge';
        }
    }

    function saveRatings() {
        const album = albums.find(a => a.id === currentRatingId);
        
        if (currentEditorMode === 'original') {
            tempReview = document.getElementById('r-review').value;
        } else {
            tempReListenReview = document.getElementById('r-review').value;
        }

        album.review = tempReview;
        album.tracks = tempTracks;
        album.rating = calculateAverage(tempTracks);
        
        let hasReListen = tempReListenTracks.some(t => t.rating !== '');
        if (hasReListen) {
            album.reListenReview = tempReListenReview;
            album.reListenTracks = tempReListenTracks;
            album.reListenRating = calculateAverage(tempReListenTracks);
        } else {
            delete album.reListenReview;
            delete album.reListenTracks;
            delete album.reListenRating;
        }

        album.isRated = true;
        saveToStorage();
        closeRatingEditor();
        renderAlbums();
    }

    // --- HOMEPAGE RENDERING & CARD TOGGLES ---
    function deleteAlbum(id) {
        if(confirm("Are you sure you want to delete this album? This cannot be undone.")) {
            albums = albums.filter(a => a.id !== id);
            saveToStorage();
            renderAlbums();
        }
    }

    function getBigThree(tracks) {
        if(!tracks || tracks.length === 0) return [];
        let valid = tracks.filter(t => t.rating !== "" && t.rating !== null && !isNaN(parseFloat(t.rating)));
        valid.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
        return valid.slice(0, 3);
    }
    
    function getFavs(tracks) {
        if(!tracks || tracks.length === 0) return [];
        return tracks.filter(t => t.isFav);
    }

    function getCardContentHTML(album, mode) {
        let isRelisten = mode === 'relisten';
        let rating = isRelisten ? album.reListenRating : album.rating;
        let review = isRelisten ? album.reListenReview : album.review;
        let tracks = isRelisten ? album.reListenTracks : album.tracks;
        
        let ratingStr = rating ? parseFloat(rating).toFixed(1) : null;
        let badgeClass = ratingStr === '5.0' ? 'pf-badge perfect' : 'pf-badge';
        if (!ratingStr || isNaN(ratingStr)) badgeClass = 'pf-badge unrated';
        
        let extraContent = '';
        
        if (album.isRated) {
            if (review) {
                extraContent += `<div class="section-label">Review</div><div class="card-review">"${review.replace(/\n/g, '<br>')}"</div>`;
            }

            let favs = getFavs(tracks);
            let bigThree = getBigThree(tracks);
            
            if (favs.length > 0 || bigThree.length > 0) {
                let flexHtml = `<div class="card-highlights-container">`;
                
                if (bigThree.length > 0) {
                    let bigThreeHtml = '';
                    const cleanCrown = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0; min-width: 13px; margin-right: 6px; margin-top: 3px;"><path d="M3 16l-3-10 7.104 4 4.896-8 4.896 8 7.104-4-3 10h-18zm0 2v4h18v-4h-18z"/></svg>`;

                    bigThree.forEach(t => {
                        bigThreeHtml += `<li style="display: flex; align-items: flex-start; margin-bottom: 8px;">${cleanCrown} <span style="line-height: 1.3; word-wrap: break-word; overflow-wrap: break-word;">${t.name}</span></li>`;
                    });
                    
                    flexHtml += `
                        <div class="highlight-col">
                            <div class="section-label" style="margin-top: 0;">Big Three <span style="text-transform: none; font-size: 9px; opacity: 0.6; font-weight: normal;">(Highest Rated)</span></div>
                            <div class="card-favs">
                                <ul class="big-three-list">${bigThreeHtml}</ul>
                            </div>
                        </div>`;
                }
                
                if (favs.length > 0) {
                    let favsHtml = '';
                    favs.forEach(t => {
                        favsHtml += `<li style="line-height: 1.3; margin-bottom: 6px;">${t.name || 'Unknown Track'}</li>`;
                    });
                    
                    flexHtml += `
                        <div class="highlight-col">
                            <div class="section-label" style="margin-top: 0;">Favorite Tracks</div>
                            <div class="card-favs">
                                <ul>${favsHtml}</ul>
                            </div>
                        </div>`;
                }
                
                flexHtml += `</div>`;
                extraContent += flexHtml;
            }
        }

        // --- EDITED BUTTONS BELOW ---
        return `
            <div class="pf-layout">
                <div class="pf-label">Albums</div>
                <div class="pf-title">${album.title}</div>
                <div class="pf-artist">${album.artist}</div>
                <div class="pf-year">${album.year}</div>
                <div class="pf-showcase">
                    <img src="${album.cover || 'https://via.placeholder.com/170?text=No+Cover'}" class="pf-cover" alt="Cover">
                    <div class="${badgeClass}">${ratingStr || '-.-'}</div>
                </div>
            </div>
            
            ${extraContent}
            
            <div class="card-actions">
                <button class="btn btn-rate" onclick="openRatingEditor('${album.id}')">Rate Album</button>
                <div class="menu-container">
                    <button class="dots-btn" onclick="toggleMenu('${album.id}')">⋮</button>
                    <div class="dropdown" id="menu-${album.id}">
                        <button onclick="openBasicModal('${album.id}')">Edit Info</button>
                        <button class="text-red" onclick="deleteAlbum('${album.id}')">Delete Album</button>
                    </div>
                </div>
            </div>
        `;
    }

    function flipCard(albumId, mode, btnElement) {
        const album = albums.find(a => a.id === albumId);
        const switchContainer = btnElement.parentElement;
        switchContainer.querySelectorAll('.relisten-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        
        document.getElementById(`card-body-${albumId}`).innerHTML = getCardContentHTML(album, mode);
    }

    let currentFilter = 'all';
    let currentSort = 'default';

    function handleFilter(val) { currentFilter = val; renderAlbums(); }
    function handleSort(val) { currentSort = val; renderAlbums(); }

    function renderAlbums() {
        const grid = document.getElementById('albumGrid');
        grid.innerHTML = '';
        
        let filtered = [...albums];
        
        if (currentFilter === 'rated') filtered = filtered.filter(a => a.isRated);
        if (currentFilter === 'unrated') filtered = filtered.filter(a => !a.isRated);

        if (currentSort === 'score-high') {
            filtered.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
        } else if (currentSort === 'score-low') {
            filtered.sort((a, b) => {
                let ratingA = a.rating ? parseFloat(a.rating) : 999;
                let ratingB = b.rating ? parseFloat(b.rating) : 999;
                return ratingA - ratingB;
            });
        } else if (currentSort === 'year-new') {
            filtered.sort((a, b) => parseInt(b.year || 0) - parseInt(a.year || 0));
        } else if (currentSort === 'artist-az') {
            filtered.sort((a, b) => (a.artist || '').localeCompare(b.artist || ''));
        }

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-light);">No albums match this view.</p>';
            return;
        }

        filtered.forEach(album => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-wrapper-${album.id}`;
            
            let topBarHTML = '';
            if (album.reListenRating) {
                topBarHTML = `
                <div class="card-top-bar">
                    <div class="relisten-switch">
                        <button class="relisten-btn active" onclick="flipCard('${album.id}', 'original', this)">Original</button>
                        <button class="relisten-btn" onclick="flipCard('${album.id}', 'relisten', this)">Re-Listen</button>
                    </div>
                </div>`;
            }

            card.innerHTML = `
                ${topBarHTML}
                <div class="card-content" id="card-body-${album.id}">
                    ${getCardContentHTML(album, 'original')}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // --- STATS LOGIC ---
    function openStatsModal() {
        const ratedAlbums = albums.filter(a => a.isRated && a.rating !== null);
        const totalRated = ratedAlbums.length;
        
        let perfectSongs = 0;
        let sumRatings = 0;
        let artistData = {};
        
        ratedAlbums.forEach(a => {
            sumRatings += parseFloat(a.rating || 0);
            
            if (!artistData[a.artist]) {
                artistData[a.artist] = { totalCumulativeScore: 0 };
            }
            
            artistData[a.artist].totalCumulativeScore += parseFloat(a.rating || 0);

            if(a.tracks) {
                a.tracks.forEach(t => {
                    let trackRating = parseFloat(t.rating);
                    if(!isNaN(trackRating)) {
                        if(trackRating === 5.0) perfectSongs++;
                        artistData[a.artist].totalCumulativeScore += trackRating;
                    }
                });
            }
        });

        const globalAvg = totalRated > 0 ? (sumRatings / totalRated).toFixed(1) : '-.-';
        
        let topArtist = '-';
        let highestScore = -1;

        for (let artist in artistData) {
            if (artistData[artist].totalCumulativeScore > highestScore) {
                highestScore = artistData[artist].totalCumulativeScore;
                topArtist = artist;
            }
        }

        document.getElementById('stats-grid-content').innerHTML = `
            <div class="stat-card">
                <div class="stat-card-title">Albums Rated</div>
                <div class="stat-card-value">${totalRated}</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-title">Global Avg</div>
                <div class="stat-card-value">${globalAvg}</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-title">Perfect Scores <span style="font-size: 9px; opacity: 0.6; text-transform: lowercase;">(songs)</span></div>
                <div class="stat-card-value" style="color: var(--perfect-green);">${perfectSongs}</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-title">Top Artist</div>
                <div class="stat-card-value" style="font-size: 16px; display: flex; align-items: center; justify-content: center; text-align: center; height: 100%; padding: 0 5px;">${topArtist}</div>
            </div>
        `;
        document.getElementById('statsModal').classList.add('active');
    }

    function closeStatsModal() {
        document.getElementById('statsModal').classList.remove('active');
    }

    renderAlbums();
</script>
