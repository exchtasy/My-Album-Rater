<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album Rater</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --surface: #f9f9f9; --text: #111111; --text-light: #666666; --border: #e0e0e0; --accent: #111111; --perfect-green: #00ff1a; --card-bg: #ffffff; --modal-overlay: rgba(255, 255, 255, 0.9); }
        [data-theme="dark"] { --bg: #121212; --surface: #1e1e1e; --text: #ffffff; --text-light: #aaaaaa; --border: #333333; --accent: #ffffff; --card-bg: #181818; --modal-overlay: rgba(18, 18, 18, 0.9); }
        body { font-family: 'Jost', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; transition: 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .site-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text); padding-bottom: 20px; margin-bottom: 30px; }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
        h1 { font-weight: 700; font-size: 26px; margin: 0; text-transform: uppercase; }
        .btn { background-color: var(--accent); color: var(--bg); border: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-outline { background-color: transparent; color: var(--text); border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        
        /* Card Layout */
        .card { border: 1px solid var(--border); padding: 30px; background: var(--card-bg); display: flex; flex-direction: column; }
        .pf-layout { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .pf-title { font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 28px; text-align: center; }
        .pf-badge { width: 90px; height: 90px; border-radius: 50%; border: 5px solid var(--text); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin: 15px 0; }
        .pf-badge.perfect { border-color: var(--perfect-green); color: var(--perfect-green); }
        
        /* The New Big Three / Favs Split */
        .card-footer-stats { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
        .stat-col { flex: 1; font-size: 11px; }
        .stat-col-title { font-weight: 700; text-transform: uppercase; margin-bottom: 5px; color: var(--text-light); }
        .stat-col ul { margin: 0; padding-left: 18px; color: var(--text); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 8px; width: 400px; }
        
        .dropdown { display: none; position: absolute; background: var(--card-bg); border: 1px solid var(--border); top: 100%; left: 0; z-index: 10; }
        .dropdown.active { display: block; }
    </style>
</head>
<body>

<div id="main-view" class="container">
    <div class="site-header">
        <div class="header-left">
            <h1>My Album Rater</h1>
            <div style="position:relative">
                <button class="btn btn-outline" onclick="document.getElementById('set-menu').classList.toggle('active')">⚙️ Settings</button>
                <div id="set-menu" class="dropdown"><button onclick="localStorage.clear(); location.reload()">Reset Data</button></div>
            </div>
            <button class="btn btn-outline" onclick="toggleTheme()">🌓 Theme</button>
        </div>
        <div class="header-right">
            <button class="btn btn-outline" onclick="renderGrid()">📊 Stats</button>
            <button class="btn" onclick="openBasicModal()">+ Add Album</button>
        </div>
    </div>
    <div class="grid" id="albumGrid"></div>
</div>

<script>
    let albums = JSON.parse(localStorage.getItem('myAlbumRaterData') || '[]');

    function toggleTheme() {
        const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
    }

    function renderGrid() {
        const grid = document.getElementById('albumGrid');
        grid.innerHTML = '';
        albums.forEach(a => {
            const sorted = [...(a.tracks || [])].sort((x, y) => (y.rating || 0) - (x.rating || 0));
            const bigThree = sorted.slice(0, 3).map(t => `<li>${t.name}</li>`).join('');
            const favs = (a.tracks || []).filter(t => t.isFav).map(t => `<li>${t.name}</li>`).join('');

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="pf-layout">
                    <div class="pf-title">${a.title}</div>
                    <div style="font-weight:600">${a.artist}</div>
                    <div class="pf-badge ${a.rating == 5 ? 'perfect' : ''}">${a.rating || '-'}</div>
                </div>
                <div class="card-footer-stats">
                    <div class="stat-col">
                        <div class="stat-col-title">Big Three</div>
                        <ul>${bigThree || '<li>-</li>'}</ul>
                    </div>
                    <div class="stat-col">
                        <div class="stat-col-title">Favorites</div>
                        <ul>${favs || '<li>-</li>'}</ul>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openBasicModal() {
        const title = prompt("Album Title");
        const artist = prompt("Artist");
        if (title && artist) {
            albums.push({id: Date.now().toString(), title, artist, tracks: []});
            localStorage.setItem('myAlbumRaterData', JSON.stringify(albums));
            renderGrid();
        }
    }

    renderGrid();
</script>
</body>
</html>
